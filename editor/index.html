<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Editor — Brandon Pieczka</title>
    <link rel="icon" href="/public/favicon.svg?v=2" />
    <link rel="stylesheet" href="/styles/index.css?v=3" />
    <link rel="stylesheet" href="/styles/blog.css?v=1" />
    <link rel="stylesheet" href="/editor/editor.css?v=1" />
  </head>
  <body class="editor-page">
    <header class="bar">
      <button id="toggle-posts" class="ghost" type="button">Posts</button>
      <span id="status" class="status" aria-live="polite"></span>
      <div class="bar-actions">
        <a id="view-live" class="ghost" target="_blank" rel="noopener" hidden>View live</a>
        <button id="open-settings" class="ghost" type="button">Settings</button>
        <button id="publish" class="primary" type="button">Publish</button>
      </div>
    </header>

    <aside id="posts-panel" class="panel" hidden>
      <div class="panel-head">
        <strong>Posts</strong>
        <button id="new-post" class="ghost" type="button">New post</button>
      </div>
      <div id="posts-list"></div>
    </aside>

    <main class="writer">
      <textarea id="title" rows="1" placeholder="Title" aria-label="Title"></textarea>
      <input id="description" placeholder="One-line summary for lists and link previews" aria-label="Summary" />
      <div class="meta-row">
        <label>Date <input id="date" type="date" /></label>
        <label>URL <span class="prefix">/blog/</span><input id="slug" spellcheck="false" /></label>
      </div>
      <div id="editor"></div>
    </main>

    <div id="text-menu" class="bubble">
      <div class="bubble-buttons">
        <button type="button" data-action="bold" data-mark="bold" title="Bold (⌘B)"><b>B</b></button>
        <button type="button" data-action="italic" data-mark="italic" title="Italic (⌘I)"><i>I</i></button>
        <button type="button" data-action="strike" data-mark="strike" title="Strikethrough"><s>S</s></button>
        <button type="button" data-action="code" data-mark="code" title="Inline code"><span class="mono">&lt;/&gt;</span></button>
        <button type="button" data-action="link" data-mark="link" title="Link">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.5 9.5a3 3 0 0 0 4.2 0l2.1-2.1a3 3 0 0 0-4.2-4.2l-.8.8M9.5 6.5a3 3 0 0 0-4.2 0L3.2 8.6a3 3 0 0 0 4.2 4.2l.8-.8" /></svg>
        </button>
        <span class="divider"></span>
        <button type="button" data-action="h2" data-mark="heading:2" title="Heading">H2</button>
        <button type="button" data-action="h3" data-mark="heading:3" title="Subheading">H3</button>
        <button type="button" data-action="quote" data-mark="blockquote" title="Quote"><span class="quote-mark">“</span></button>
      </div>
      <form id="link-form" class="link-form">
        <input type="text" placeholder="Paste a link and press Enter" aria-label="Link URL" />
      </form>
    </div>

    <div id="image-menu" class="bubble">
      <div class="bubble-buttons">
        <button type="button" data-action="alt" class="text">Alt text</button>
        <button type="button" data-action="removeMedia" class="text">Remove</button>
      </div>
    </div>

    <div id="insert-menu" class="inserter">
      <button id="insert-toggle" class="plus" type="button" aria-label="Insert media">+</button>
      <div id="insert-options" class="insert-options" hidden>
        <button type="button" data-action="image">Image</button>
        <button type="button" data-action="video">Video</button>
        <button type="button" data-action="youtube">YouTube</button>
        <button type="button" data-action="list">List</button>
        <button type="button" data-action="codeBlock">Code</button>
        <button type="button" data-action="divider">Divider</button>
      </div>
    </div>

    <input id="pick-image" type="file" accept="image/*" multiple hidden />
    <input id="pick-video" type="file" accept="video/mp4,video/webm,video/quicktime" hidden />

    <dialog id="settings">
      <form>
        <h2>Connect GitHub</h2>
        <p>To publish, the editor commits posts to your repo, and the site redeploys. Your token stays in this browser.</p>
        <label>Token
          <input name="token" type="password" autocomplete="off" placeholder="github_pat_…" />
        </label>
        <p class="hint">
          <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Create a fine-grained token</a>
          with access to only the Portfolio repo and <strong>Contents: Read and write</strong> permission.
        </p>
        <div class="two">
          <label>Repo <input name="repo" required /></label>
          <label>Branch <input name="branch" required /></label>
        </div>
        <p id="settings-error" class="error" aria-live="polite"></p>
        <div class="dialog-actions">
          <button id="settings-cancel" class="ghost" type="button">Cancel</button>
          <button class="primary" type="submit">Save</button>
        </div>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status"></div>

    <script type="module" src="/editor/app.js?v=1"></script>
  </body>
</html>
